<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="SaaS Billing and Usage Metering Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a34"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <style>
      .t { font: 700 20px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .s { font: 400 12px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .zone { fill: #131c36; stroke: #293b66; stroke-width: 1.5; rx: 14; }
      .zl { font: 700 11px 'Inter', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.08em; fill: #38bdf8; text-transform: uppercase; }
      .box { fill: #1b284c; stroke: #3b82f6; stroke-width: 1.3; rx: 10; }
      .box-db { fill: #132c37; stroke: #10b981; stroke-width: 1.4; rx: 10; }
      .box-warn { fill: #252042; stroke: #f59e0b; stroke-width: 1.3; rx: 10; }
      .bt { font: 600 13px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f1f5f9; }
      .bs { font: 400 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .e { stroke: #38bdf8; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .ew { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#aw); }
      .lbl { font: 600 10.5px 'JetBrains Mono', monospace; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>
  <text x="34" y="40" class="t">Multi-Tenant SaaS Billing &amp; Usage Metering Architecture</text>
  <text x="34" y="60" class="s">PostgreSQL FORCE RLS (11 tables) &#183; Two-Phase Redis Lua Quota &#183; Transactional Outbox &#183; BullMQ + DLQ &#183; Hourly Reconciliation</text>

  <!-- Layer 1: API &amp; Auth &amp; Quota -->
  <rect x="34" y="82" width="1052" height="150" class="zone"/>
  <text x="50" y="104" class="zl">1. NestJS Control Plane &amp; Two-Phase Quota Gate (:4000)</text>
  <rect x="52" y="120" width="320" height="94" class="box"/>
  <text x="68" y="142" class="bt">Auth, RBAC &amp; Token Families</text>
  <text x="68" y="160" class="bs">Argon2 passwords &#183; 15m JWT access</text>
  <text x="68" y="177" class="bs">30d refresh cookie family reuse kill</text>
  <text x="68" y="194" class="bs">Roles: owner &#183; admin &#183; billing &#183; member</text>

  <rect x="400" y="120" width="336" height="94" class="box-warn"/>
  <text x="416" y="142" class="bt">Redis Lua QuotaService (@fb3/metering)</text>
  <text x="416" y="160" class="bs">1. reserve(): Lua atomic used+reserved&lt;=lim</text>
  <text x="416" y="177" class="bs">2. commit(): decrby reserved, incrby used</text>
  <text x="416" y="194" class="bs">3. release(): rollback on dup/DB error</text>

  <rect x="764" y="120" width="304" height="94" class="box"/>
  <text x="780" y="142" class="bt">Stripe Billing &amp; Overrides</text>
  <text x="780" y="160" class="bs">Signed webhooks &#183; event ID dedupe</text>
  <text x="780" y="177" class="bs">Out-of-order timestamp guard (&lt;=)</text>
  <text x="780" y="194" class="bs">Time-bounded entitlement overrides</text>

  <!-- Layer 2: Database RLS + Outbox -->
  <rect x="34" y="258" width="1052" height="152" class="zone"/>
  <text x="50" y="280" class="zl">2. PostgreSQL Multi-Tenant Source of Truth (Strict RLS + Append-Only Triggers)</text>
  <rect x="52" y="296" width="500" height="96" class="box-db"/>
  <text x="68" y="318" class="bt">tenantTransaction() &amp; Immutable Ledger</text>
  <text x="68" y="336" class="bs">SET LOCAL app.organization_id = orgId + FORCE RLS (11 tables)</text>
  <text x="68" y="353" class="bs">usage_events: UNIQUE(org_id, idempotency_key) ON CONFLICT NOTHING</text>
  <text x="68" y="370" class="bs">reject_mutation() trigger blocks UPDATE/DELETE on usage_events &amp; audit_log</text>

  <rect x="580" y="296" width="488" height="96" class="box-db"/>
  <text x="596" y="318" class="bt">Same-Transaction Outbox &amp; Materialized Hourly Buckets</text>
  <text x="596" y="336" class="bs">outbox row (topic='usage.recorded') committed alongside usage_events</text>
  <text x="596" y="353" class="bs">processed_events(consumer, event_id) enforces exact-once fold</text>
  <text x="596" y="370" class="bs">usage_aggregates(org_id, metric, date_trunc('hour', occurred_at))</text>

  <!-- Layer 3: Async Worker, DLQ &amp; Self-Healing -->
  <rect x="34" y="436" width="1052" height="152" class="zone"/>
  <text x="50" y="458" class="zl">3. BullMQ Async Worker, Dead-Letter Replay &amp; Hourly Reconciler (:4001)</text>
  <rect x="52" y="474" width="320" height="96" class="box"/>
  <text x="68" y="496" class="bt">Outbox Relay &amp; BullMQ Consumer</text>
  <text x="68" y="514" class="bs">1s poll: FOR UPDATE SKIP LOCKED (100)</text>
  <text x="68" y="531" class="bs">Concurrency=20 &#183; 5 exp backoff retries</text>
  <text x="68" y="548" class="bs">Moves exhausted jobs -&gt; usage-dlq</text>

  <rect x="400" y="474" width="336" height="96" class="box-db"/>
  <text x="416" y="496" class="bt">Hourly Drift Reconciler (reconcileAndRepair)</text>
  <text x="416" y="514" class="bs">Re-sums raw immutable usage_events</text>
  <text x="416" y="531" class="bs">Upserts mismatched hour buckets &amp; cleans</text>
  <text x="416" y="548" class="bs">orphaned aggregate rows automatically</text>

  <rect x="764" y="474" width="304" height="96" class="box"/>
  <text x="780" y="496" class="bt">Observability &amp; Ops Console</text>
  <text x="780" y="514" class="bs">End-to-end event stage latency trace</text>
  <text x="780" y="531" class="bs">Burn-rate forecast + 80% soft alerts</text>
  <text x="780" y="548" class="bs">Prometheus metrics + DLQ admin replay</text>

  <!-- Edges -->
  <path d="M 372 167 L 400 167" class="e"/>
  <path d="M 568 214 L 302 296" class="e"/>
  <path d="M 350 296 L 540 214" class="ew"/>
  <text x="392" y="250" class="lbl">commit / release</text>
  <path d="M 552 344 L 580 344" class="e"/>
  <path d="M 824 392 L 212 474" class="e"/>
  <path d="M 372 522 L 400 522" class="e"/>
  <path d="M 736 522 L 764 522" class="e"/>
</svg>
