services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fb3, POSTGRES_PASSWORD: fb3, POSTGRES_DB: fb3 }
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fb3"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fb3:fb3@postgres:5432/fb3
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"], interval: 10s, timeout: 5s, retries: 10 }
    networks:
      default:
      edge:
        aliases:
          - billing-api
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://fb3:fb3@postgres:5432/fb3
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fb3:fb3@postgres:5432/fb3
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"], interval: 10s, timeout: 5s, retries: 10 }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks:
      default:
      edge:
        aliases:
          - billing-web
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [metrics]
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.2.0
    profiles: [metrics]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
volumes: { pgdata: {}, redisdata: {} }
networks:
  edge:
    external: true
    name: portfolio-edge
